[pytest]
# 只从 testcases 目录收集用例
testpaths = testcases
# 把项目根目录加入 sys.path，保证 from common.xxx / from pages.xxx 可用
pythonpath = .
# 默认参数：-v 详细输出；allure 结果(每次运行先清空，避免历史用例混入报告)；pytest-html 报告
addopts = -v --alluredir=reports/allure_results --clean-alluredir --html=reports/html/report.html --self-contained-html
# 自定义标记
markers =
    smoke: 冒烟测试
    regression: 回归测试
