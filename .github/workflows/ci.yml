name: 自动化测试 CI


on:
  push:
    branches: [ main ]      # 推 main 就跑
  pull_request:             # 提 PR 也跑
  workflow_dispatch:        # 允许在网页上手动点按钮跑

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30


    env:
      WEB_HEADLESS: "true"
      WEB_BROWSER: "edge"
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
      PYTHONIOENCODING: "utf-8"

    steps:

      - name: 拉取代码
        uses: actions/checkout@v4


      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip


      - name: 安装依赖
        run: pip install -r requirements.txt


      - name: 运行测试
        run: python -m pytest -v


      - name: 上传测试产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            reports/html/
            reports/allure_results/
            logs/
            screenshots/
          if-no-files-found: ignore