# ============ Web UI 配置 ============
web:
  base_url: https://www.saucedemo.com   # 被测网站地址
  browser: edge                         # 可选: chrome / edge
  headless: false                       # true=无头运行(不弹浏览器窗口)
  timeout: 10                           # 显式等待超时时间(秒)
  account:
    username: standard_user             # 正常账号
    password: secret_sauce
    locked_user: locked_out_user        # 被锁定账号(用于反向用例)

# ============ 接口配置 ============
api:
  base_url: https://reqres.in/api       # 被测接口根地址
  timeout: 30                           # 请求超时(秒)
  retries: 2                            # 超时/连接失败/5xx 重试次数(429 是配额信号，不重试)
  backoff: 1                            # 重试退避基数(秒)，第 n 次重试等待 backoff*n
  api_key: ""                           # 可选：优先读环境变量 REQRES_API_KEY；填这里也可，但不要提交到 git

# ============ 日志配置 ============
log:
  level: INFO                           # DEBUG / INFO / WARNING / ERROR
